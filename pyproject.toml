[project]
name = "retriever-mcp-demo"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<6",
  "django-oauth-toolkit>=3.0",
  "fastmcp>=2.0",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "django-vite>=3.0",
  "whitenoise>=6.6",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[tool.vercel]
entrypoint = "config.asgi:application"

[tool.vercel.scripts]
build = "npm install && npm run build"
